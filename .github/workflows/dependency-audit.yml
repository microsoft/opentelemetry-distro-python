name: Weekly dependency audit

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_CONFIG_FILE: /dev/null
      PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple
      PIP_EXTRA_INDEX_URL: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned audit tools from Microsoft feed
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          -r .github/dependency-audit-requirements.txt

      - name: Audit locked dependencies and verify feed availability
        run: python dependency_audit.py --output dependency-audit-report.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5.0.1
        with:
          name: dependency-audit-report
          path: dependency-audit-report.json
          if-no-files-found: error
          retention-days: 14
